name: 🔄 Mise à jour automatique de l'emploi du temps

on:
  schedule:
    - cron: "0 * * * *" # Toutes les heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-emploi:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Cloner le dépôt
        uses: actions/checkout@v4

      - name: 📥 Télécharger le fichier ICS
        run: |
          echo "Téléchargement de l'emploi du temps..."
          curl -L -o emploi-du-temps.ics \
            "https://hplanning.univ-lehavre.fr/Telechargements/ical/Edt_ST_L3___INFORMATIQUE.ics?version=2022.0.5.0&idICal=878F4702AFE5022EFD588352AC8AC291&param=643d5b312e2e36325d2666683d3126663d3131303030"

      - name: 💾 Commit et push si modification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add emploi-du-temps.ics

          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique de l'emploi du temps"
            git push
          else
            echo "Aucune modification détectée"
          fi